[custom]

; =========================================================
; MiSub / SubConverter
; Clash Meta / Mihomo 2026
;
; 最终整理版
;
; 1. 已彻底移除 Aethersailor
; 2. 所有 ruleset URL 后的 86400 已删除
; 3. 不使用 1800 等规则集更新参数
; 4. 使用 Mihomo GEOSITE / GEOIP 减少外部规则依赖
; 5. MRS 明确声明 clash-domain
; 6. YAML 规则明确声明 clash-classic
; 7. 非标端口使用本地 DST-PORT
;
; =========================================================

; =========================================================
; 一、局域网 / 私有地址
; =========================================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list

; Mihomo Meta Rules Dat
; MRS 为域名规则集，因此明确声明 clash-domain
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs

; =========================================================
; 二、Mihomo 内置国内规则
; =========================================================

; Google 中国大陆服务
ruleset=🎯 全球直连,[]GEOSITE,google-cn

; 中国大陆游戏平台
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

; Steam 中国
ruleset=🎯 全球直连,[]GEOSITE,steam@cn

; 游戏平台下载
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download

; 公共 BT / PT Tracker
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; =========================================================
; 三、Google FCM
; =========================================================

ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list

; Google 中国代理 IP
; 该规则不能简单用 GEOSITE 完全替代，因此保留
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google
