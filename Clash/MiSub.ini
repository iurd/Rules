; MiSub / Subconverter 外部配置（Mihomo / Clash Meta）
; 配套文件：mihomo_base.yml。上传两个文件到同一 GitHub 仓库后，替换下面 base 地址。

[custom]
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/YOUR_NAME/YOUR_REPO/main/mihomo_base.yml

; ---------- 策略组 ----------
; select 组中第一个选项是默认策略；[] 表示引用其他策略组。
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 全部节点`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🌍 全部节点`select`.*
custom_proxy_group=🤖 AI 服务`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT
; 默认取订阅第一个节点；请在客户端手动选择一个长期稳定的美国节点，勿选自动测速组。
custom_proxy_group=🟣 Claude 固定出口`select`.*`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点
custom_proxy_group=📺 流媒体`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=📲 社交通讯`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=💻 开发服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🇨🇳 国内流量`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🔒 直连流量`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🛡️ WebRTC 防护`select`[]REJECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]♻️ 自动选择

; ---------- 国家/地区分组 ----------
; 同时兼容中文、英文缩写、全称及常见旗帜命名；机场名称不规范时需补充正则。
custom_proxy_group=🇭🇰 香港节点`select`(港|香港|HK|Hong.?Kong|🇭🇰)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇹🇼 台湾节点`select`(台|台湾|臺灣|TW|Taiwan|🇹🇼)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇯🇵 日本节点`select`(日|日本|JP|Japan|🇯🇵)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇸🇬 新加坡节点`select`(新加坡|狮城|獅城|SG|Singapore|🇸🇬)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇸 美国节点`select`(美|美国|美國|US|United.?States|America|🇺🇸)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇰🇷 韩国节点`select`(韩|韩国|韓國|KR|Korea|🇰🇷)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇬🇧 英国节点`select`(英|英国|英國|UK|GB|United.?Kingdom|Britain|🇬🇧)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇩🇪 德国节点`select`(德|德国|德國|DE|Germany|🇩🇪)`http://www.gstatic.com/generate_204`300

; ---------- 分流规则（自上而下，国内规则放在最后） ----------
; 使用 blackmatrix7 的 Clash classical 规则；GEOSITE/GEOIP 由 Mihomo 内核处理。
ruleset=🛡️ WebRTC 防护,[]DST-PORT,3478
ruleset=🛡️ WebRTC 防护,[]DST-PORT,5349
ruleset=🛡️ WebRTC 防护,[]DST-PORT,19302
ruleset=🔒 直连流量,[]GEOSITE,private
ruleset=🔒 直连流量,[]GEOIP,LAN,no-resolve
ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml
